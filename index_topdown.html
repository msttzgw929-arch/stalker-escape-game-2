<script>
'use strict';
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
let LW=960,LH=540,DPR=1,SC=1,OX=0,OY=0;
const FONT='"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';

// ---------- assets ----------
const IM={};let loaded=0,toLoad=0;
function loadImg(k,src){toLoad++;const i=new Image();i.onload=()=>{loaded++;};i.src=src;IM[k]=i;}
for(const k in ASSETS){if(k!=='meta')loadImg(k,ASSETS[k]);}
const META=ASSETS.meta;
const FACES=['normal','angry','rage','happy','pain'];
let womanCv=null,womanCx=null; // composed sprite with current face
function initWoman(){
  womanCv=document.createElement('canvas');womanCv.width=META.w;womanCv.height=META.h;
  womanCx=womanCv.getContext('2d');womanCx.drawImage(IM.sprite,0,0);
}
// face crossfade state
const face={from:'normal',to:'normal',t:1,dirty:true};
function setFace(f){ if(face.to===f)return; face.from=(face.t<0.5)?face.from:face.to; face.to=f; face.t=0; face.dirty=true; }
function updateFace(dt){
  if(face.t<1){face.t=Math.min(1,face.t+dt/0.22);face.dirty=true;}
  if(face.dirty&&womanCx){
    const x=META.faceX,y=META.faceY,w=META.faceW;
    womanCx.clearRect(x,y,w,w);
    womanCx.globalAlpha=1;womanCx.drawImage(IM['face_'+face.from],x,y,w,w);
    if(face.t>0){womanCx.globalAlpha=face.t;womanCx.drawImage(IM['face_'+face.to],x,y,w,w);}
    womanCx.globalAlpha=1;
    face.dirty=false;
  }
}

// ---------- audio ----------
let AC=null,master=null,muted=false,bgmGain=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:0.6;master.connect(AC.destination);
  bgmGain=AC.createGain();bgmGain.gain.value=0.16;bgmGain.connect(master);
}
let noiseBuf=null;
function noise(){ if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;} const s=AC.createBufferSource();s.buffer=noiseBuf;return s;}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function tone(type,f0,f1,dur,vol,dest,when){
  if(!AC)return;const t=(when||AC.currentTime);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,0.005,vol,dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.05);
}
const SFX={
  slap(){ if(!AC)return;const t=AC.currentTime;const n=noise();const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800+Math.random()*900;bp.Q.value=0.8;
    const g=AC.createGain();env(g,t,0.002,0.9,0.11);n.connect(bp);bp.connect(g);g.connect(master);n.start(t);n.stop(t+0.2);
    tone('sine',190,55,0.18,0.7);},
  boing(big){ if(!AC)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    const b=big?140:220;o.frequency.setValueAtTime(b,t);o.frequency.linearRampToValueAtTime(b*1.6,t+0.06);o.frequency.linearRampToValueAtTime(b*0.8,t+0.16);o.frequency.linearRampToValueAtTime(b*1.25,t+0.26);o.frequency.linearRampToValueAtTime(b*0.9,t+0.4);
    env(g,t,0.01,big?0.5:0.3,0.42);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.5);},
  step(lv){ tone('sine',75-lv*4,40,0.12,0.18+lv*0.04); },
  capture(){ tone('square',700,180,0.35,0.18); setTimeout(()=>tone('triangle',300,600,0.25,0.25),120); },
  levelup(){ if(!AC)return; tone('sawtooth',55,110,0.9,0.3); tone('square',220,440,0.5,0.12); setTimeout(()=>{tone('square',330,330,0.15,0.12);tone('square',415,415,0.15,0.1);},350); SFX.boing(true);},
  escape(){ if(!AC)return;const t=AC.currentTime;[523,659,784,1046].forEach((f,i)=>tone('triangle',f,0,0.14,0.25,master,t+i*0.07)); },
  hurt(){ tone('square',440,110,0.5,0.22); },
  over(){ if(!AC)return;const t=AC.currentTime;[392,330,262,196].forEach((f,i)=>tone('triangle',f,f*0.97,0.3,0.28,master,t+i*0.22)); },
  click(){ tone('triangle',880,1320,0.08,0.18); }
};
// simple tense BGM loop
let bgmNext=0,bgmStep=0,bgmOn=false;
const BASS=[45,45,57,45,48,45,52,50, 45,45,57,45,53,52,48,47];
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function bgmTick(){
  if(!AC||!bgmOn)return;
  const tempo=0.2-Math.min(0.07,G.level*0.012);
  while(bgmNext<AC.currentTime+0.15){
    const n=BASS[bgmStep%16];
    tone('triangle',mtof(n),0,tempo*0.9,0.5,bgmGain,bgmNext);
    if(bgmStep%4===2){const s=noise(),g=AC.createGain(),hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;env(g,bgmNext,0.002,0.25,0.05);s.connect(hp);hp.connect(g);g.connect(bgmGain);s.start(bgmNext);s.stop(bgmNext+0.08);}
    if(bgmStep%16===0&&G.level>=2)tone('sawtooth',mtof(n+24),0,tempo*3,0.12,bgmGain,bgmNext);
    bgmNext+=tempo;bgmStep++;
  }
}
function startBgm(){ if(!AC)return; bgmOn=true; bgmNext=AC.currentTime+0.05; bgmStep=0; }
function stopBgm(){ bgmOn=false; }

// ---------- utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function bump(v,a,p,b){ if(v<=a||v>=b)return 0; return v<p?sstep((v-a)/(p-a)):sstep((b-v)/(b-p)); }
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- springs ----------
function Spring(k,c){return {x:0,y:0,vx:0,vy:0,k,c};}
function stepSpring(s,dt,fx,fy,kmul){
  const k=s.k*(kmul||1);
  s.vx+=(-k*s.x-s.c*s.vx+(fx||0))*dt; s.vy+=(-k*s.y-s.c*s.vy+(fy||0))*dt;
  s.x+=s.vx*dt; s.y+=s.vy*dt;
  const L=46; if(s.x>L){s.x=L;s.vx*=-0.3;} if(s.x<-L){s.x=-L;s.vx*=-0.3;} if(s.y>L){s.y=L;s.vy*=-0.3;} if(s.y<-L){s.y=-L;s.vy*=-0.3;}
}

// ---------- woman ----------
function makeWoman(){
  return {x:0,y:0,vx:0,vy:0,hs:200,phase:0,bob:0,sway:0,lean:0,
    U:Spring(130,6.5),L:Spring(85,4.2),B:Spring(170,7),SQ:Spring(110,5),
    G:0,Gv:0,Gt:0,stun:0,lastSin:0,rx:60,ry:25,bellyX:0,bellyY:0,topY:0};
}
function kickBelly(w,ix,iy,sq){
  w.L.vx+=ix; w.L.vy+=iy; w.U.vx+=ix*0.7; w.U.vy+=iy*0.6; w.B.vx+=ix*0.4; w.B.vy+=iy*0.5; w.SQ.vx+=sq||0;
}
function updateWoman(w,dt,ax,ay,speed){
  // growth spring with overshoot (pump-up)
  w.Gv+=((w.Gt-w.G)*34-w.Gv*5.5)*dt; w.G+=w.Gv*dt;
  const heavy=1/(1+w.G*0.12);
  // inertial forces from acceleration (opposite)
  const fx=-ax*0.11, fy=-ay*0.05;
  // walk
  if(speed>5){ w.phase+=dt*(3.2+speed*0.028); } else { w.phase+=dt*1.2*(w.bob>0.02?1:0.0); }
  const s=Math.sin(w.phase);
  const moving=speed>5;
  if(moving && Math.sign(s)!==Math.sign(w.lastSin)){ // foot plant
    const side=s>0?1:-1;
    kickBelly(w,side*(10+w.G*2.5),(26+w.G*5)*Math.min(1,speed/120),0);
    if(G.state==='play')SFX.step(Math.min(5,G.level));
  }
  w.lastSin=s;
  const tb=moving?Math.abs(s):0; w.bob=lerp(w.bob,tb,clamp(dt*14,0,1));
  w.sway=lerp(w.sway,moving?Math.sin(w.phase)*7:Math.sin(performance.now()/900)*2.5,clamp(dt*6,0,1));
  w.lean=lerp(w.lean,clamp(w.vx*0.05,-12,12),clamp(dt*4,0,1));
  stepSpring(w.U,dt,fx,fy,heavy); stepSpring(w.L,dt,fx*1.3,fy*1.3,heavy); stepSpring(w.B,dt,fx*0.8,fy*0.8,1);
  stepSpring(w.SQ,dt,0,0,heavy);
  // idle breathing jiggle

const STRIP=3;
function drawWoman(c,w,shadow){
  const img=womanCv,W=img.width,H=img.height,cxs=META.cx;
  const k=w.hs/H;
  const sqY=1-w.bob*0.035, sqX=1+w.bob*0.03;
  const N=Math.ceil(H/STRIP);
  const ys=new Float32Array(N+1),xs=new Float32Array(N+1),ws=new Float32Array(N+1);
  // heights cumulative
  let cum=0;const cums=new Float32Array(N+1);
  for(let i=0;i<=N;i++){cums[i]=cum; const v=(i*STRIP)/H; const gh=1+w.G*0.10*bump(v,.27,.68,1.0)+w.G*0.02*bump(v,.12,.24,.36); cum+=STRIP*gh;}
  const total=cums[N];
  const top=w.y-total*k*sqY;
  w.topY=top;
  const t=performance.now()/1000;
  for(let i=0;i<=N;i++){
    const v=(i*STRIP)/H;
    const wb=bump(v,.12,.24,.37), wu=bump(v,.26,.42,.59), wl=bump(v,.44,.72,1.02);
    const dy=w.U.y*wu+w.L.y*wl+w.B.y*wb;
    const dx=w.U.x*wu+w.L.x*wl+w.B.x*wb;
    const gw=1+w.G*0.13*bump(v,.24,.70,1.45)+w.G*0.04*wb;
    const sx=gw*(1+0.0065*(w.U.y*wu+w.L.y*wl)+0.004*w.B.y*wb+0.012*w.SQ.x*(wl+wu*0.6));
    ys[i]=top+(cums[i]+dy)*k*sqY;
    xs[i]=w.x+((w.sway+w.lean)*(1-v)*(1-v)+dx)*k;
    ws[i]=sx*k*sqX;
  }
  // shadow
  const bw=META.w*0.5*ws[Math.floor(N*0.72)]/k*k;
  if(shadow!==false){
    c.save();c.fillStyle='rgba(0,0,0,0.28)';c.beginPath();c.ellipse(w.x,w.y+2,bw*0.95,bw*0.22,0,0,Math.PI*2);c.fill();c.restore();
  }

  const sh=w.hs*0.035, sp=META.w*0.14*k*(1+w.G*0.08);
  for(const side of[-1,1]){
    const lift=(w.bob>0.02)?Math.max(0,Math.sin(w.phase)*side)*w.hs*0.03:0;
    c.fillStyle='#2a0a0e';c.beginPath();c.ellipse(w.x+side*sp,w.y-lift-sh*0.3,sh*1.9,sh*1.0,0,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(255,255,255,0.25)';c.beginPath();c.ellipse(w.x+side*sp-sh*0.5,w.y-lift-sh*0.7,sh*0.7,sh*0.3,0,0,Math.PI*2);c.fill();
  }
  // strips
  for(let i=0;i<N;i++){
    const sy=i*STRIP, sh2=Math.min(STRIP,H-sy);
    const y0=ys[i], y1=ys[i+1]; const hh=Math.max(0.5,(y1-y0)*(sh2/STRIP))+0.75;
    const sw=ws[i];
    c.drawImage(img,0,sy,W,sh2,xs[i]-cxs*sw,y0,W*sw,hh);
  }
  const bi=Math.floor(N*0.70);
  w.bellyX=xs[bi]; w.bellyY=ys[bi]; w.bellyW=bw;
  w.faceY=ys[Math.floor(N*0.07)]; w.faceX=xs[Math.floor(N*0.07)];
}

      c.fillStyle='#8fd0ff';c.beginPath();c.moveTo(-9*s,-56*s);c.quadraticCurveTo(-13*s,-50*s,-9*s,-49*s);c.quadraticCurveTo(-5*s,-50*s,-9*s,-56*s);c.fill();}

const keys={};
const touch={id:null,ox:0,oy:0,x:0,y:0,active:false};
function toLogical(cx,cy){return {x:(cx-OX)/SC,y:(cy-OY)/SC};}

  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Space'].includes(e.key)||e.code==='Space')e.preventDefault();

// ---------- update ----------
function update(dt){
  updateFace(dt);
  for(const p of G.popups){p.t+=dt;p.y+=p.vy*dt;} G.popups=G.popups.filter(p=>p.t<p.life);
  for(const p of G.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.heart?-10:500)*dt;p.vx*=0.98;} G.parts=G.parts.filter(p=>p.t<p.life);
  G.shake=Math.max(0,G.shake-dt*30); G.levelText=Math.max(0,G.levelText-dt); G.flash=Math.max(0,G.flash-dt);
  if(G.slapFx){G.slapFx.t+=dt;if(G.slapFx.t>0.18)G.slapFx=null;}
  if(G.state==='title'){
    if(LW>LH){W0.hs=LH*0.86;W0.x=LW*0.72;W0.y=LH*0.97;}else{W0.hs=LH*0.55;W0.x=LW*0.5;W0.y=LH*0.995;}
    titleT+=dt;
    W0.Gt=(Math.sin(titleT*0.5)>0.6)?1.2:0;
    if(Math.random()<dt*0.8)kickBelly(W0,rnd(-30,30),rnd(20,50),rnd(-20,20));
    const f=(titleT%9<5)?'normal':(titleT%9<6.5?'happy':'angry'); setFace(f);
    updateWoman(W0,dt,0,0,0);
    return;
  }
  if(G.state==='over'){ G.overT+=dt; updateWoman(W0,dt,0,0,0); if(Math.random()<dt*1.5)kickBelly(W0,rnd(-20,20),rnd(10,30),0); G.zoom=lerp(G.zoom,1,dt*3); return; }
  if(G.state!=='play')return;
  const c=G.cap;
  if(c){
    if(c.phase==='mash'){
      c.time+=dt; c.gauge=Math.max(0,c.gauge-c.decay*dt);
      if(c.time>=c.limit)failCapture();
    } else if(c.phase==='hug'){
      c.end+=dt;
      if(Math.random()<dt*6)kickBelly(W0,rnd(-15,15),rnd(5,20),0);
      if(c.end>1.5){
        if(G.lives<=0){gameOver();return;}
        P.kx=c.side*560;P.ky=0;P.inv=2.5;W0.stun=1.0;G.cap=null;
      }
    }
    // stick player to belly front
    if(G.cap){
      const maxY=LH-(LW>LH?95:160); if(W0.y>maxY)W0.y=lerp(W0.y,maxY,dt*6);
      P.x=lerp(P.x,W0.x+c.side*W0.rx*0.42,dt*12); P.y=lerp(P.y,W0.y+6,dt*12); P.vx=P.vy=0;
      const z=1.3; G.zoom=lerp(G.zoom,z,dt*5); G.zx=lerp(G.zx,W0.x,dt*5); G.zy=lerp(G.zy,W0.y-(LH/2-(LW>LH?105:150))/z,dt*5);
      updateWoman(W0,dt,0,0,0);
      chooseFace(dt);
      return;
    }
  }
  G.zoom=lerp(G.zoom,1,dt*4);
  G.time+=dt;
  // irritation
  G.irr+=dt/(13+G.level*1.5);
  if(G.irr>=1){
    if(G.level<MAXLV){G.level++;G.irr=0;levelUp();} else G.irr=1;
  }
  // player move
  const d=inputDir(); const spd=245;
  P.vx=lerp(P.vx,d.dx*spd,clamp(dt*14,0,1)); P.vy=lerp(P.vy,d.dy*spd,clamp(dt*14,0,1));
  P.x+=(P.vx+P.kx)*dt; P.y+=(P.vy+P.ky)*dt; P.kx*=Math.pow(0.02,dt); P.ky*=Math.pow(0.02,dt);
  if(Math.abs(P.vx)>5)P.face=P.vx>0?1:-1;
  P.walk+=dt*Math.hypot(P.vx,P.vy)*0.07;
  P.x=clamp(P.x,FIELD.left,FIELD.right); P.y=clamp(P.y,FIELD.top+12,FIELD.bottom);
  P.inv=Math.max(0,P.inv-dt);
  // woman AI
  let ax=0,ay=0,speed=0;
  if(W0.stun>0){W0.stun-=dt;W0.vx*=Math.pow(0.05,dt);W0.vy*=Math.pow(0.05,dt);}
  else{
    const maxS=Math.min(215,88+G.level*14+G.time*0.9);
    // predictive chase
    const tx=P.x+P.vx*0.35, ty=P.y+P.vy*0.35;
    const dx=tx-W0.x, dy=(ty-W0.y)*1.25; const m=Math.hypot(dx,dy)||1;
    const acc=260+G.level*25;
    ax=dx/m*acc; ay=dy/m*acc;
    W0.vx+=ax*dt; W0.vy+=ay*dt;
    const vm=Math.hypot(W0.vx,W0.vy); if(vm>maxS){W0.vx*=maxS/vm;W0.vy*=maxS/vm;}
    W0.vx*=Math.pow(0.6,dt);W0.vy*=Math.pow(0.6,dt);
  }
  W0.x+=W0.vx*dt; W0.y+=W0.vy*dt;
  W0.x=clamp(W0.x,FIELD.left+W0.rx*0.3,FIELD.right-W0.rx*0.3); W0.y=clamp(W0.y,FIELD.top+W0.ry,FIELD.bottom);
  speed=Math.hypot(W0.vx,W0.vy);
  updateWoman(W0,dt,ax*(W0.stun>0?0:1),ay*(W0.stun>0?0:1),speed);
  // capture check
  if(P.inv<=0){
    const nx=(P.x-W0.x)/W0.rx, ny=(P.y-W0.y)/W0.ry;
    if(nx*nx+ny*ny<1)startCapture();
  }
  chooseFace(dt);
}
function chooseFace(dt){
  G.lvlFace=Math.max(0,G.lvlFace-dt); G.hitFace=Math.max(0,G.hitFace-dt);
  let f='normal';
  const c=G.cap;
  if(c){ f=(c.phase==='mash'&&(G.hitFace>0||c.gauge>65))?'pain':'happy'; }
  else if(W0.stun>0)f='pain';
  else if(G.lvlFace>0)f='rage';
  else{
    const dist=Math.hypot(P.x-W0.x,P.y-W0.y);
    if(G.level===0) f=(dist<W0.rx*2.2)?'happy':'normal';
    else if(G.level===1) f=G.irr>0.5?'angry':(dist<W0.rx*2.2?'happy':'normal');
    else if(G.level<4) f='angry';
    else f=G.irr>0.4?'rage':'angry';
  }
  setFace(f);
}
function levelUp(){
  W0.Gt=G.level; G.levelText=2.2; G.lvlFace=1.6; G.shake=12;
  SFX.levelup(); kickBelly(W0,rnd(-30,30),-70,70);
  popup(W0.x,W0.topY,'ムキーッ！！',34,'#ff3b3b',1.2,-30);
  burst(W0.bellyX,W0.bellyY,16,'#ff6b6b');
}
function gameOver(){
  G.state='over';G.overT=0;stopBgm();SFX.over();setFace('happy');
  if(G.time>G.best){G.best=G.time;G.newBest=true;try{localStorage.setItem('stalkerBest',String(G.best));}catch(e){}}else G.newBest=false;
}

// ---------- render ----------
let titleT=0;
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#120a12';ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.setTransform(SC*DPR,0,0,SC*DPR,OX*DPR,OY*DPR);
  ctx.save();ctx.beginPath();ctx.rect(0,0,LW,LH);ctx.clip();
  if(G.state==='loading'){ctx.fillStyle='#fff';ctx.font=`24px ${FONT}`;ctx.textAlign='center';ctx.fillText('読み込み中…',LW/2,LH/2);ctx.restore();return;}
  // camera
  ctx.save();
  const sx=(Math.random()-0.5)*G.shake, sy=(Math.random()-0.5)*G.shake;
  ctx.translate(sx,sy);
  if(G.zoom>1.001){const z=G.zoom,f=clamp((z-1)/0.3,0,1); const cx=clamp(lerp(LW/2,G.zx,f),LW/(2*z),LW-LW/(2*z)), cy=clamp(lerp(LH/2,G.zy,f),LH/(2*z),LH-LH/(2*z)); ctx.translate(LW/2,LH/2);ctx.scale(z,z);ctx.translate(-cx,-cy);}
  ctx.drawImage(bgCv,0,0,LW,LH);
  if(G.state==='title'){
    // darker overlay
    ctx.fillStyle='rgba(20,5,20,0.35)';ctx.fillRect(0,0,LW,LH);
    drawWoman(ctx,W0,false);
  } else {
    // depth sort
    const playerFront=(P.y>=W0.y)||G.cap;
    const scared=Math.hypot(P.x-W0.x,P.y-W0.y)<W0.rx*2.5;
    const ps=U()/540*1.05;
    if(!playerFront)drawPlayer(ctx,P,ps,scared,false);
    drawWoman(ctx,W0);
    if(playerFront)drawPlayer(ctx,P,ps,scared,!!G.cap);
    // slap hand effect
    if(G.slapFx){const f=G.slapFx;const a=1-f.t/0.18;ctx.save();ctx.globalAlpha=a;ctx.translate(f.x,f.y);ctx.rotate(f.side*0.4);
      ctx.strokeStyle='#fff';ctx.lineWidth=4;for(let i=0;i<8;i++){const an=i*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(an)*14,Math.sin(an)*14);ctx.lineTo(Math.cos(an)*(30+f.t*120),Math.sin(an)*(30+f.t*120));ctx.stroke();}
      ctx.fillStyle='#ffd9bf';ctx.strokeStyle='#5a3a2a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,13,16,0,0,7);ctx.fill();ctx.stroke();
      for(let i=-1;i<=2;i++){ctx.beginPath();ctx.ellipse(i*6-1,-18,3.2,8,0,0,7);ctx.fill();ctx.stroke();}
      ctx.restore();}
  }
  // particles
  for(const p of G.parts){const a=1-p.t/p.life;ctx.globalAlpha=a;ctx.fillStyle=p.col;
    if(p.heart){drawHeart(ctx,p.x,p.y,p.r);} else if(p.star){drawStar(ctx,p.x,p.y,p.r*1.6);} else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}}
  ctx.globalAlpha=1;
  // popups (world)
  for(const p of G.popups){const a=1-Math.max(0,(p.t-p.life*0.6)/(p.life*0.4));const s=p.size*(1+Math.max(0,0.25-p.t)*2);
    outlined(p.text,p.x,p.y,s,p.color,a);}
  ctx.restore();
  // flash
  if(G.flash>0){ctx.fillStyle=`rgba(255,60,120,${G.flash*0.5})`;ctx.fillRect(0,0,LW,LH);}
  if(G.state==='title')drawTitle();
  else{drawHUD(); if(G.cap)drawCaptureUI(); if(G.state==='over')drawOver();}
  // joystick
  if(touch.active&&G.state==='play'&&!G.cap){ctx.globalAlpha=0.35;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(touch.ox,touch.oy,55,0,7);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(touch.x,touch.y,22,0,7);ctx.fill();ctx.globalAlpha=1;}
  // mute
  const mb=muteBtnRect();ctx.globalAlpha=0.6;ctx.fillStyle='#000';rr(ctx,mb.x,mb.y,mb.w,mb.h,8);ctx.fill();ctx.globalAlpha=1;ctx.font=`20px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(muted?'🔇':'🔊',mb.x+mb.w/2,mb.y+mb.h/2+1);
  ctx.restore();
}
function drawHeart(c,x,y,r){c.beginPath();c.moveTo(x,y+r*0.8);c.bezierCurveTo(x-r*1.4,y-r*0.2,x-r*0.6,y-r*1.3,x,y-r*0.4);c.bezierCurveTo(x+r*0.6,y-r*1.3,x+r*1.4,y-r*0.2,x,y+r*0.8);c.fill();}
function drawStar(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr2=i%2?r*0.45:r;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}c.closePath();c.fill();}
function outlined(text,x,y,size,col,alpha,align){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size*0.18);ctx.strokeStyle='rgba(30,0,20,0.9)';ctx.strokeText(text,x,y);ctx.fillStyle=col;ctx.fillText(text,x,y);ctx.restore();
}
function drawPortrait(x,y,r){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle='#fbe3e8';ctx.fill();ctx.clip();
  const sz=r*2.35;
  ctx.globalAlpha=1;ctx.drawImage(IM['port_'+face.from],x-sz/2,y-sz*0.47,sz,sz);
  if(face.t>0){ctx.globalAlpha=face.t;ctx.drawImage(IM['port_'+face.to],x-sz/2,y-sz*0.47,sz,sz);}
  ctx.restore();
  ctx.lineWidth=4;ctx.strokeStyle=G.level>=4?'#ff3b3b':'#ffb3c7';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}
function drawHUD(){
  const pad=12;
  // time
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(ctx,pad,pad,210,62,12);ctx.fill();
  outlined('生存時間',pad+12,pad+16,15,'#ffd6e4',1,'left');
  outlined(G.time.toFixed(2)+' 秒',pad+12,pad+42,28,'#fff',1,'left');
  // lives
  for(let i=0;i<3;i++){ctx.fillStyle=i<G.lives?'#ff4f8b':'rgba(255,255,255,0.25)';drawHeart(ctx,pad+20+i*26,pad+86,10);}
  // portrait + irritation
  const pr=LW>LH?40:36; const px=LW-pad-pr-4, py=pad+pr+2;
  drawPortrait(px,py,pr);
  const bw=Math.min(240,LW*0.36),bx=px-pr-14-bw,by=pad+8;
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(ctx,bx-8,by-4,bw+16,62,12);ctx.fill();
  outlined('イライラ度 Lv'+(G.level+1),bx,by+13,17,G.level>=4?'#ff6b6b':'#ffd6e4',1,'left');
  ctx.fillStyle='rgba(255,255,255,0.15)';rr(ctx,bx,by+30,bw,16,8);ctx.fill();
  const gr=ctx.createLinearGradient(bx,0,bx+bw,0);gr.addColorStop(0,'#ffb347');gr.addColorStop(1,'#ff2d55');ctx.fillStyle=gr;
  const fillw=Math.max(0.001,bw*(G.level>=MAXLV?1:G.irr)); rr(ctx,bx,by+30,Math.max(16,fillw),16,8);ctx.fill();
  if(G.level>=MAXLV)outlined('MAX',bx+bw/2,by+38,13,'#fff',1);
  // level text
  if(G.levelText>0){const a=Math.min(1,G.levelText);const s=1+Math.max(0,G.levelText-1.8)*1.5;
    outlined('イライラ度 Lv'+(G.level+1)+'！',LW/2,LH*0.42,52*s,'#ff3b3b',a);outlined('お腹がさらに巨大化！',LW/2,LH*0.42+50,26,'#fff',a);}
  if(G.state==='play'&&!G.cap&&G.time<3.5){outlined(('ontouchstart' in window)?'ドラッグで移動':'矢印キー / WASD で移動',LW/2,LH-40,22,'#fff',Math.min(1,3.5-G.time));}
}
function drawCaptureUI(){
  const c=G.cap; if(c.phase!=='mash')return;
  const bw=Math.min(420,LW*0.78),bx=LW/2-bw/2,by=LH-52;
  ctx.fillStyle='rgba(0,0,0,0.55)';rr(ctx,bx-14,by-42,bw+28,90,14);ctx.fill();
  const pulse=1+Math.sin(performance.now()/70)*0.06;
  outlined(('ontouchstart' in window)?'連打でお腹をはたけ！':'連打でお腹をはたけ！（スペース / クリック）',LW/2,by-22,('ontouchstart' in window)?26*pulse:22*pulse,'#ffe066');
  ctx.fillStyle='rgba(255,255,255,0.15)';rr(ctx,bx,by,bw,22,11);ctx.fill();
  const gr=ctx.createLinearGradient(bx,0,bx+bw,0);gr.addColorStop(0,'#4fd1ff');gr.addColorStop(1,'#7dffb0');ctx.fillStyle=gr;rr(ctx,bx,by,Math.max(22,bw*c.gauge/100),22,11);ctx.fill();
  outlined('脱出ゲージ',bx+8,by+11,14,'#fff',1,'left');
  // time bar
  const tr=1-c.time/c.limit; ctx.fillStyle=tr<0.3?'#ff3b3b':'#ffb3c7';rr(ctx,bx,by+30,Math.max(6,bw*tr),8,4);ctx.fill();
}
function drawTitle(){
  const land=LW>LH;
  const tx=land?LW*0.3:LW/2, ty=land?LH*0.25:LH*0.07;
  const wob=Math.sin(titleT*3)*3;
  outlined('巨腹ストーカー',tx,ty+wob,land?62:52,'#ff5c8a');
  outlined('から逃げろ！',tx,ty+(land?66:56)+wob,land?52:44,'#fff');
  const lines=['お腹が太ったストーカー女性に','捕まらないように逃げ回れ！','','移動：矢印キー / WASD / ドラッグ','捕まったら：連打でお腹をはたいて脱出','時間が経つとイライラしてお腹が巨大化…！'];
  ctx.fillStyle='rgba(0,0,0,0.5)';const bw=land?380:440,bh=lines.length*28+20;rr(ctx,tx-bw/2,ty+(land?110:96),bw,bh,14);ctx.fill();
  lines.forEach((l,i)=>outlined(l,tx,ty+(land?132:118)+i*28,land?17:18,i<2?'#ffd6e4':'#fff'));
  const a=0.6+Math.sin(titleT*4)*0.4;
  outlined(('ontouchstart' in window)?'タップでスタート':'クリック / スペースでスタート',tx,land?LH*0.86:LH*0.405,30,'#ffe066',a);
  if(G.best>0)outlined('ベスト: '+G.best.toFixed(2)+' 秒',tx,land?LH*0.93:LH*0.435,18,'#fff',1);
}
function drawOver(){
  const a=Math.min(1,G.overT*2);
  ctx.fillStyle=`rgba(30,0,20,${0.55*a})`;ctx.fillRect(0,0,LW,LH);
  outlined('つかまっちゃった…',LW/2,LH*0.28,54,'#ff5c8a',a);
  outlined('「もう逃がさないわよ♡」',LW/2,LH*0.28+56,24,'#ffd6e4',a);
  outlined('生存時間 '+G.time.toFixed(2)+' 秒',LW/2,LH*0.52,40,'#fff',a);
  outlined((G.newBest?'★ベスト更新！ ':'ベスト ')+G.best.toFixed(2)+' 秒',LW/2,LH*0.52+46,22,G.newBest?'#ffe066':'#ffd6e4',a);
  outlined('最終イライラ度 Lv'+(G.level+1),LW/2,LH*0.52+80,18,'#ffb3c7',a);
  if(G.overT>0.9)outlined(('ontouchstart' in window)?'タップでリトライ':'スペース / クリックでリトライ',LW/2,LH*0.85,30,'#ffe066',0.6+Math.sin(G.overT*4)*0.4);
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(G.state==='loading'&&loaded===toLoad&&toLoad>0){initWoman();G.state='title';resetGame();}
  if(G.state!=='loading'){const sub=dt>0.02?2:1;for(let i=0;i<sub;i++)update(dt/sub);}
  bgmTick();
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
// test hooks
window.__G=G;window.__W=W0;window.__P=P;window.__startGame=startGame;window.__startCapture=startCapture;window.__slap=slap;window.__levelUp=()=>{if(G.level<MAXLV){G.level++;G.irr=0;levelUp();}};
</script>
